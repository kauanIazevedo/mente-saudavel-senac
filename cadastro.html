<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Tela de Cadastro</title>
</head>
<body>
    <h1>Cadastro</h1>
    <form>
        <label for="nome">Nome completo:</label><br>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required><br><br>

        <label for="email">E-mail:</label><br>
        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required><br><br>

        <label for="senha">Senha:</label><br>
        <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required><br><br>

        <label for="confirmar">Confirmar senha:</label><br>
        <input type="password" id="confirmar" name="confirmar" placeholder="Repita a senha" required><br><br>

        <input type="submit" value="Cadastrar">
    </form>
</body>
</html>
